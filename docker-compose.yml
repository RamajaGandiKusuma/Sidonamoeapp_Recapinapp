services:
  web:
    build: .
    container_name: web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sidonamoe_net

  postgres_n8n:
    image: postgres:15
    container_name: postgres_n8n
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: n8n
    volumes:
      - postgres_n8n_data:/var/lib/postgresql/data
    networks:
      - sidonamoe_net

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    depends_on:
      - postgres_n8n
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres_n8n
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: n8n
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - sidonamoe_net

networks:
  sidonamoe_net:

volumes:
  postgres_n8n_data:
  n8n_data:
